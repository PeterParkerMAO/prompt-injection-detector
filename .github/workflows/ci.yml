name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5   # confira a versão atual da action
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -m pid.cli --synthetic --out /tmp/reports
